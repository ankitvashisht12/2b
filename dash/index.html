<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2b</title>
<style>
  :root { color-scheme: light dark; --muted: #8a8a8a; --line: #8884; --bad: #d64545; }
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0 auto; padding: 24px; max-width: 1200px; }
  header { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 auto 0 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  h3 { font-size: 14px; margin: 16px 0 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; }
  .card:hover, .card:focus { border-color: var(--muted); outline: none; }
  .failed { border-color: var(--bad); }
  .muted { color: var(--muted); }
  .overdue { color: var(--bad); font-weight: 600; }
  .badge { font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); }
  .event { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
  dialog { max-width: 780px; width: 90vw; border: 1px solid var(--line); border-radius: 10px; }
  pre { white-space: pre-wrap; font-size: 13px; }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>2b</h1>
  <button id="previous" aria-label="Previous week">◀</button>
  <input id="week" type="date" aria-label="Any day in the week to show">
  <button id="next" aria-label="Next week">▶</button>
  <button id="this-week">This week</button>
</header>
<section id="failed"></section>
<div class="grid">
  <section><h2>Projects</h2><div id="projects"></div></section>
  <section>
    <h2>Due in the next 7 days</h2><div id="due"></div>
    <h2 id="week-title">Week</h2><div id="events"></div>
  </section>
</div>
<dialog id="detail">
  <form method="dialog" style="float:right"><button>Close</button></form>
  <div id="detail-body"></div>
</dialog>
<script>
const byId = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
const addDays = (day, count) => { const date = new Date(day + 'T00:00:00Z'); date.setUTCDate(date.getUTCDate() + count); return date.toISOString().slice(0, 10); };
const today = new Date().toLocaleDateString('en-CA');
const OPEN_PROJECT_STATUSES = ['active', 'on-hold', 'paused'];
const CLOSED_PROJECT_STATUSES = ['done', 'archived'];
const isOpenTask = task => !['done', 'dropped'].includes(task.status);
const card = (id, html, extraClass = '') => `<div class="card ${extraClass}" tabindex="0" data-id="${escapeHtml(id)}">${html}</div>`;
const safeUrl = url => /^https?:\/\//.test(url) ? escapeHtml(url) : '#';

async function load(day) {
  const response = await fetch('/api/state?week=' + day);
  if (!response.ok) {
    byId('failed').textContent = await response.text();
    return;
  }
  const state = await response.json();
  byId('week').value = day;
  byId('week-title').textContent = `Week ${state.week.start} – ${state.week.end}`;
  renderFailed(state.failed);
  renderProjects(state);
  renderDue(state);
  renderEvents(state.events);
}

function renderFailed(failed) {
  byId('failed').innerHTML = failed.length === 0 ? '' : '<h2>Failed recurring tasks</h2>' + failed.map(task =>
    card(task.id, `<b>${escapeHtml(task.title)}</b> <span class="muted">last run ${escapeHtml(task['last-run'])}</span>`, 'failed')).join('');
}

function projectCard(project, tasks) {
  const openTasks = tasks.filter(task => task.project === project.id && isOpenTask(task)).length;
  const deadline = project.deadline && project.deadline !== 'unknown' ? ` · deadline ${escapeHtml(project.deadline)}` : '';
  const reason = project['status-reason'] ? `<div class="muted">${escapeHtml(project['status-reason'])}</div>` : '';
  return card(project.id, `<b>${escapeHtml(project.title)}</b> <span class="badge">${escapeHtml(project.area)}</span> <span class="muted">${openTasks} open tasks${deadline}</span>${reason}`);
}

function renderProjects(state) {
  const section = (status, open) => {
    const projects = state.projects.filter(project => project.status === status);
    if (projects.length === 0) return '';
    const cards = projects.map(project => projectCard(project, state.tasks)).join('');
    return open ? `<h3>${status} (${projects.length})</h3>${cards}` : `<details><summary class="muted">${status} (${projects.length})</summary>${cards}</details>`;
  };
  byId('projects').innerHTML = [
    ...OPEN_PROJECT_STATUSES.map(status => section(status, true)),
    ...CLOSED_PROJECT_STATUSES.map(status => section(status, false)),
  ].join('') || '<p class="muted">No projects yet.</p>';
}

function renderDue(state) {
  const horizon = addDays(state.today, 7);
  const due = state.tasks
    .filter(task => /^\d{4}-\d{2}-\d{2}$/.test(task.due ?? '') && task.due <= horizon && isOpenTask(task))
    .sort((first, second) => first.due.localeCompare(second.due));
  byId('due').innerHTML = due.map(task => card(task.id,
    `<span class="${task.due < state.today ? 'overdue' : ''}">${escapeHtml(task.due)}</span> <b>${escapeHtml(task.title)}</b> <span class="muted">${escapeHtml(task.project)} · ${escapeHtml(task.status)}</span>`)).join('')
    || '<p class="muted">Nothing due.</p>';
}

function renderEvents(events) {
  if (events.length === 0) {
    byId('events').innerHTML = '<p class="muted">No activity recorded this week.</p>';
    return;
  }
  const groups = {};
  for (const event of events) (groups[event.project] ??= []).push(event);
  byId('events').innerHTML = Object.entries(groups).map(([project, projectEvents]) =>
    `<h3><a href="#" data-id="${escapeHtml(project)}">${escapeHtml(project)}</a></h3>` + projectEvents.map(event => {
      const task = event.task ? `<a href="#" data-id="${escapeHtml(event.task)}">${escapeHtml(event.task.split('/')[1])}</a> · ` : '';
      const detail = event.detail ? ` — ${escapeHtml(event.detail)}` : '';
      return `<div class="event"><span class="muted">${escapeHtml(event.at.slice(5))}</span><span>${task}${escapeHtml(event.event)}${detail}</span></div>`;
    }).join('')).join('');
}

const list = (title, items, render) => items && items.length ? `<h4>${title}</h4><ul>${items.map(item => `<li>${render(item)}</li>`).join('')}</ul>` : '';

async function showDetail(id) {
  const response = await fetch('/api/entry?id=' + encodeURIComponent(id));
  if (!response.ok) return;
  const entry = await response.json();
  const fields = entry.fields;
  const fileUrl = file => '/api/file?path=' + encodeURIComponent(entry.relativeDir + '/' + file);
  byId('detail-body').innerHTML = `
    <h2>${escapeHtml(entry.kind)} · ${escapeHtml(entry.id)}</h2>
    <h3>${escapeHtml(fields.title)}</h3>
    <p><span class="badge">${escapeHtml(fields.status)}</span> ${escapeHtml(fields['status-reason'])}</p>
    <p class="muted">started ${escapeHtml(fields.started)}${fields.due ? ' · due ' + escapeHtml(fields.due) : ''}${fields.deadline ? ' · deadline ' + escapeHtml(fields.deadline) : ''}${fields.every ? ' · every ' + escapeHtml(fields.every) : ''}</p>
    ${fields['last-log'] ? `<p><a href="${fileUrl(fields['last-log'])}" target="_blank">Last run log</a> (${escapeHtml(fields['last-result'])})</p>` : ''}
    ${list('Tasks', entry.tasks, task => `<a href="#" data-id="${escapeHtml(task.id)}">${escapeHtml(task.title)}</a> <span class="muted">${escapeHtml(task.status)}</span>`)}
    ${list('PRs', fields.prs, url => `<a href="${safeUrl(url)}" target="_blank">${escapeHtml(url)}</a>`)}
    ${list('Artifacts', fields.artifacts, artifact => `<a href="${fileUrl(artifact.path)}" target="_blank">${escapeHtml(artifact.title || artifact.path)}</a> <span class="muted">${escapeHtml(artifact.about)}</span>`)}
    ${list('Resources', fields.resources, resource => resource.url ? `<a href="${safeUrl(resource.url)}" target="_blank">${escapeHtml(resource.title)}</a>` : `${escapeHtml(resource.title)} <span class="muted">${escapeHtml(resource.path)}</span>`)}
    ${list('Links', fields.links, link => `${escapeHtml(link.type)} → <a href="#" data-id="${escapeHtml(link.to)}">${escapeHtml(link.to)}</a>`)}
    ${list('Linked from', entry.reverseLinks, link => `<a href="#" data-id="${escapeHtml(link.from)}">${escapeHtml(link.from)}</a> (${escapeHtml(link.type)})`)}
    <h4>Rules</h4><pre>${escapeHtml(entry.rules)}</pre>
    <h4>Description</h4><pre>${escapeHtml(entry.body.trim())}</pre>
    <h4>Log</h4><pre>${escapeHtml(entry.log)}</pre>`;
  if (!byId('detail').open) byId('detail').showModal();
}

document.addEventListener('click', event => {
  const target = event.target.closest('[data-id]');
  if (!target) return;
  event.preventDefault();
  showDetail(target.dataset.id);
});
document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.dataset?.id) showDetail(event.target.dataset.id);
});
byId('previous').onclick = () => load(addDays(byId('week').value, -7));
byId('next').onclick = () => load(addDays(byId('week').value, 7));
byId('this-week').onclick = () => load(today);
byId('week').onchange = () => byId('week').value && load(byId('week').value);
load(new URLSearchParams(location.search).get('week') || today);
</script>
</body>
</html>

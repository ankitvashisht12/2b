<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f6">
  <title>2b — Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232b5647'/%3E%3Ctext x='7' y='28' font-family='system-ui' font-weight='700' font-size='25' fill='%23fff'%3E2b%3C/text%3E%3C/svg%3E">
  <script>try { const theme = localStorage.getItem('2b-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch {}</script>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="rail" aria-label="Workspace">
      <a class="brand" href="#/home" aria-label="2b home"><span class="brand-mark">2b</span><span class="brand-name">Second brain</span></a>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="rail-footer"><span class="local-label"><span class="connection-dot"></span>Local workspace</span><div class="rail-tools"><button id="theme-toggle" class="icon-button" aria-label="Change theme" title="Change theme"></button><button id="shortcut-button" class="icon-button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"></button></div></div>
    </aside>
    <div class="workspace">
      <header id="topbar" class="topbar" aria-label="Filters"></header>
      <main id="main" tabindex="-1"></main>
      <footer class="workspace-footer"><span>Everything has its place.</span><button class="text-button" data-action="shortcuts">Keyboard shortcuts <kbd>?</kbd></button></footer>
    </div>
  </div>
  <dialog id="creation-dialog" class="creation-dialog" aria-labelledby="creation-dialog-title"></dialog>
  <div id="drawer-root"></div>
  <div id="popover-root"></div>
  <div id="palette-root"></div>
  <div id="toasts" class="toasts" aria-label="Notifications"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p class="empty-state">Enable JavaScript to use the dashboard. Your data remains available through the 2b CLI.</p></noscript>
</body>
</html>
